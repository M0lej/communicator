[build]
  base = "."
  command = "npm --prefix client ci && npm --prefix server ci && npm --prefix server run build && npm --prefix client run build"
  publish = "client/dist"

[server]
  region = "fra"

[server.scale]
  max = 1

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/friends"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200

[dev]
  command = "npm --prefix server run build && npm --prefix client run dev -- --host 0.0.0.0"
  targetPort = 5173
