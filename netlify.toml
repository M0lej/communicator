[build]
  base = "."
  command = "npm ci && npm run build --workspace=server && npm run build --workspace=client"  
  publish = "client/dist"

[server]
  region = "fra"

[server.scale]
  max = 1
  base = "client"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "yarn start" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "dist" # Folder with the static content for _redirect file

[[redirects]]
  from = "/friends"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run build --workspace=server && npm run dev --workspace=client -- --host 0.0.0.0"
  targetPort = 5173
