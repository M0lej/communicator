[build]
  base = "."
  command = "npm ci && npm run build --workspace=server && npm run build --workspace=client"  
  publish = "client/dist"

[server]
  region = "fra"

[server.scale]
  max = 1

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/friends"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run build --workspace=server && npm run dev --workspace=client -- --host 0.0.0.0"
  targetPort = 5173
